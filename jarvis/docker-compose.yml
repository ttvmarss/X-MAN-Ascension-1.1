version: "3.9"

services:
  jarvis:
    build: .
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "8340:8340"
    volumes:
      - ./data:/app/data          # Persist memory, databases
      - ./.env:/app/.env:ro       # Env vars (read-only inside container)
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FISH_API_KEY=${FISH_API_KEY}
      - FISH_VOICE_ID=${FISH_VOICE_ID:-612b878b113047d9a770c069c8b4fdfe}
      - USER_NAME=${USER_NAME:-sir}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - WEATHER_LOCATION=${WEATHER_LOCATION:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8340/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
