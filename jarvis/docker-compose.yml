version: "3.9"

services:
  jarvis:
    build: .
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "8340:8340"
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # Persist memory, databases
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8340/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
